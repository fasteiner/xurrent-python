# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "Dev" ]
  workflow_dispatch:

jobs:
  build:

    # ubuntu-latest (Ubuntu 26.04) has no Python 3.9 in actions/setup-python any more; 3.9 runs on 24.04
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest python-dotenv mock
        pip install .
    - name: Lint with flake8
      run: |
        # Stop the build on syntax errors or undefined names
        flake8 ./src/ --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Unit tests
      run: |
        pytest ./tests/unit_tests
        pytest ./src/ --doctest-modules -v
    - name: Integration tests
      env:
        # OAuth client credentials of the demo account; DEMO_API_TOKEN is only the fallback.
        XURRENT_CLIENT_ID: ${{ secrets.DEMO_CLIENT_ID }}
        XURRENT_CLIENT_SECRET: ${{ secrets.DEMO_CLIENT_SECRET }}
        APITOKEN: ${{ secrets.DEMO_API_TOKEN }}
        APIACCOUNT: ${{ vars.DEMO_APIACCOUNT }}
        APIURL: ${{ vars.DEMO_APIURL }}
      run: |
        pytest ./tests/integration

