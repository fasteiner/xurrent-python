# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set environment variables
      env:
        API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        APIACCOUNT: ${{ vars.DEMO_APIACCOUNT }}
        APIURL: ${{ vars.DEMO_APIURL }}
      run: |
        echo "Environment variables set:"
        echo "APITOKEN=*******"
        echo "APIACCOUNT=${{ vars.DEMO_APIACCOUNT }}"
        echo "APIURL=${{ vars.DEMO_APIURL }}"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest python-dotenv mock
        pip install .
    - name: Lint with flake8
      run: |
        # Stop the build on syntax errors or undefined names
        flake8 ./src/ --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Unit tests
      run: |
        pytest ./tests/unit_tests
        pytest ./src/ --doctest-modules -v
    - name: Integration tests
      env:
        APITOKEN: ${{ secrets.DEMO_API_TOKEN }}
        APIACCOUNT: ${{ vars.DEMO_APIACCOUNT }}
        APIURL: ${{ vars.DEMO_APIURL }}
      run: |
        pytest ./tests/integration

