name: Create Release

on:
  push:
    branches:
      - main
      - Dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      python_changed: ${{ steps.check-python-changes.outputs.python_changed }}
      effective_version: ${{ steps.effective-version.outputs.effective_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for GitVersion to work correctly

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v3

      - name: Extract Release Notes from Changelog
        id: extract-changelog
        uses: release-flow/keep-a-changelog-action@v3.0.0
        with:
          command: query
          version: unreleased

      - name: Check for Python file changes
        id: check-python-changes
        # Diff against the last release tag, not HEAD^: after a rebase merge HEAD^ is only the PR's
        # second-to-last commit, so .py changes in earlier PR commits were missed (0.16.1 was only tagged).
        # The last release is the last vX.Y.Z tag (created with the GitHub release); on Dev a preview
        # vX.Y.Z-preview.N counts too. This works the same for merge, squash and rebase merges.
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            BASE_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' HEAD 2>/dev/null || true)
          else
            BASE_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null || true)
          fi

          if [[ -n "$BASE_TAG" ]]; then
            echo "Last release tag: $BASE_TAG"
            CHANGED_FILES=$(git diff --name-only "$BASE_TAG" HEAD)
          else
            echo "No release tag found → comparing with the empty tree (everything counts as changed)."
            CHANGED_FILES=$(git diff --name-only "$(git hash-object -t tree /dev/null)" HEAD)
          fi
          echo "Changed files: $CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -E '\.py$'; then
            echo "python_changed=true" >> $GITHUB_ENV
            echo "python_changed=true" >> $GITHUB_OUTPUT
          else
            echo "python_changed=false" >> $GITHUB_ENV
            echo "python_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine Effective Version
        id: effective-version
        run: |
          if [[ "${{ env.python_changed }}" == "true" ]]; then
            EFFECTIVE_VERSION="${{ steps.gitversion.outputs.semVer }}"
          else
            # Stable tags only: a reachable preview tag (X.Y.Z-preview.N) would break the arithmetic below
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude '*-*')
            echo "Previous tag: $PREV_TAG"
            CLEAN_TAG=${PREV_TAG#v}

            MAJOR=$(echo $CLEAN_TAG | cut -d. -f1)
            MINOR=$(echo $CLEAN_TAG | cut -d. -f2)
            PATCH=$(echo $CLEAN_TAG | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))

            EFFECTIVE_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
            echo "Forcing patch bump: $EFFECTIVE_VERSION"
          fi

          echo "effective_version=$EFFECTIVE_VERSION" >> $GITHUB_ENV
          echo "effective_version=$EFFECTIVE_VERSION" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        if: github.ref == 'refs/heads/main'
        # [Unreleased] becomes the version GitVersion calculated (keep-a-changelog-action's bump could only
        # count up from the last version in the changelog, e.g. 0.11.0 -> 0.12.0 instead of 0.14.0)
        run: python3 .github/scripts/release_changelog.py CHANGELOG.md "${{ steps.effective-version.outputs.effective_version }}" "${{ github.server_url }}/${{ github.repository }}"

      - name: Commit Updated CHANGELOG.md
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update CHANGELOG for release ${{ steps.effective-version.outputs.effective_version }}"
          file_pattern: "CHANGELOG.md"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Required Python Packages
        run: pip install build tomlkit

      - name: Update Version in pyproject.toml
        run: |
          python - <<EOF
          import tomlkit
          pyproject_file = "pyproject.toml"
          with open(pyproject_file, "r", encoding="utf-8") as f:
              data = tomlkit.load(f)
          data["project"]["version"] = "${{ steps.effective-version.outputs.effective_version }}"
          data["tool"]["poetry"]["version"] = "${{ steps.effective-version.outputs.effective_version }}"
          with open(pyproject_file, "w", encoding="utf-8") as f:
              tomlkit.dump(data, f)
          EOF

      - name: Commit Updated pyproject.toml
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update pyproject.toml for release ${{ steps.effective-version.outputs.effective_version }}"
          file_pattern: "pyproject.toml"

      - name: Build release distributions
        if: env.python_changed == 'true'
        run: |
          python -m pip install build
          python -m build

      - name: Create Git Tag
        run: |
          git tag ${{ steps.effective-version.outputs.effective_version }}
          git push origin ${{ steps.effective-version.outputs.effective_version }}

      - name: Create GitHub Release
        if: env.python_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.effective-version.outputs.effective_version }}
          name: Release v${{ steps.effective-version.outputs.effective_version }}
          body: "${{ steps.extract-changelog.outputs.release-notes }}"
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/Dev' }}
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload distributions
        if: env.python_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - create-release
    if: github.ref == 'refs/heads/main' && needs.create-release.outputs.python_changed == 'true'
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
