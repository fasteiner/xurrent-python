name: Create Release

on:
  push:
    branches:
      - main
      - Dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      package_changed: ${{ steps.check-package-changes.outputs.package_changed }}
      effective_version: ${{ steps.effective-version.outputs.effective_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for GitVersion to work correctly

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v3

      - name: Extract Release Notes from Changelog
        id: extract-changelog
        uses: release-flow/keep-a-changelog-action@v3.0.0
        with:
          command: query
          version: unreleased

      - name: Check for package changes
        id: check-package-changes
        # Release only when the package itself changed (src/), across all commits of this push. Tests,
        # docs, CI or the README alone release nothing: no tag, no CHANGELOG or version change, no PyPI
        # upload. (A dependency change in pyproject.toml alone also needs a change in src/ to be released.)
        run: |
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="HEAD^"
          fi
          CHANGED_FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "Changed files: $CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE '^src/'; then
            echo "package_changed=true" >> $GITHUB_ENV
            echo "package_changed=true" >> $GITHUB_OUTPUT
          else
            echo "package_changed=false" >> $GITHUB_ENV
            echo "package_changed=false" >> $GITHUB_OUTPUT
            echo "::notice::No changes under src/ in this push: nothing is released (no tag, CHANGELOG or version change)."
          fi

      - name: Determine Effective Version
        id: effective-version
        if: env.package_changed == 'true'
        run: |
          EFFECTIVE_VERSION="${{ steps.gitversion.outputs.semVer }}"
          echo "effective_version=$EFFECTIVE_VERSION" >> $GITHUB_ENV
          echo "effective_version=$EFFECTIVE_VERSION" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        if: github.ref == 'refs/heads/main' && env.package_changed == 'true'
        # [Unreleased] becomes the version GitVersion calculated (keep-a-changelog-action's bump could only
        # count up from the last version in the changelog, e.g. 0.11.0 -> 0.12.0 instead of 0.14.0)
        run: python3 .github/scripts/release_changelog.py CHANGELOG.md "${{ steps.effective-version.outputs.effective_version }}" "${{ github.server_url }}/${{ github.repository }}"

      - name: Commit Updated CHANGELOG.md
        if: github.ref == 'refs/heads/main' && env.package_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update CHANGELOG for release ${{ steps.effective-version.outputs.effective_version }}"
          file_pattern: "CHANGELOG.md"

      - uses: actions/setup-python@v5
        if: env.package_changed == 'true'
        with:
          python-version: "3.x"

      - name: Install Required Python Packages
        if: env.package_changed == 'true'
        run: pip install build tomlkit

      - name: Update Version in pyproject.toml
        if: env.package_changed == 'true'
        run: |
          python - <<EOF
          import tomlkit
          pyproject_file = "pyproject.toml"
          with open(pyproject_file, "r", encoding="utf-8") as f:
              data = tomlkit.load(f)
          data["project"]["version"] = "${{ steps.effective-version.outputs.effective_version }}"
          data["tool"]["poetry"]["version"] = "${{ steps.effective-version.outputs.effective_version }}"
          with open(pyproject_file, "w", encoding="utf-8") as f:
              tomlkit.dump(data, f)
          EOF

      - name: Commit Updated pyproject.toml
        if: env.package_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update pyproject.toml for release ${{ steps.effective-version.outputs.effective_version }}"
          file_pattern: "pyproject.toml"

      - name: Build release distributions
        if: env.package_changed == 'true'
        run: |
          python -m pip install build
          python -m build

      - name: Create Git Tag
        if: env.package_changed == 'true'
        run: |
          git tag ${{ steps.effective-version.outputs.effective_version }}
          git push origin ${{ steps.effective-version.outputs.effective_version }}

      - name: Create GitHub Release
        if: env.package_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.effective-version.outputs.effective_version }}
          name: Release v${{ steps.effective-version.outputs.effective_version }}
          body: "${{ steps.extract-changelog.outputs.release-notes }}"
          draft: false
          prerelease: ${{ github.ref == 'refs/heads/Dev' }}
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload distributions
        if: env.package_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - create-release
    if: github.ref == 'refs/heads/main' && needs.create-release.outputs.package_changed == 'true'
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
